<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jost:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <title>Calculator</title>
</head>

<body>
    <div id="container">
        <div id="calculator-container">
            <div id="display"><span></span></div>
            <div id="buttons-container">
                <button class="buttons color-blue" data-type="control" data-value="clear">AC</button>
                <button class="buttons color-blue" data-type="control" data-value="delete">DEL</button>
                <button class="buttons color-blue" data-type="operator" data-value="%">%</button>
                <button class="buttons color-blue" data-type="number" data-value="/">/</button>
                <button class="buttons" data-type="number" data-value="7">7</button>
                <button class="buttons" data-type="number" data-value="8">8</button>
                <button class="buttons" data-type="number" data-value="9">9</button>
                <button class="buttons color-blue" data-type="operator" data-value="*">x</button>
                <button class="buttons" data-type="number" data-value="4">4</button>
                <button class="buttons" data-type="number" data-value="5">5</button>
                <button class="buttons" data-type="number" data-value="6">6</button>
                <button class="buttons color-blue" data-type="operator" data-value="-">-</button>
                <button class="buttons" data-type="number" data-value="1">1</button>
                <button class="buttons" data-type="number" data-value="2">2</button>
                <button class="buttons" data-type="number" data-value="3">3</button>
                <button class="buttons color-blue" data-type="operator" data-value="+">+</button>
                <button class="buttons" data-type="number" data-value="0">0</button>
                <button class="buttons" data-type="number" data-value="00">00</button>
                <button class="buttons" data-type="number" data-value=".">.</button>
                <button class="buttons color-blue" data-type="equal" data-value="=">=</button>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
