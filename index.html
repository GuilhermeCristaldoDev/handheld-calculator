<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jost:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <title>Calculator</title>
</head>

<body>
    <div id="container">
        <div id="calculator-container">
            <div id="display"><span>25 + 35 / 7</span></div>
            <div id="buttons-container">
                <button class="buttons color-blue">AC</button>
                <button class="buttons color-blue">DEL</button>
                <button class="buttons color-blue">%</button>
                <button class="buttons color-blue">/</button>
                <button class="buttons">7</button>
                <button class="buttons">8</button>
                <button class="buttons">9</button>
                <button class="buttons color-blue">*</button>
                <button class="buttons">4</button>
                <button class="buttons">5</button>
                <button class="buttons">6</button>
                <button class="buttons color-blue">-</button>
                <button class="buttons">1</button>
                <button class="buttons">2</button>
                <button class="buttons">3</button>
                <button class="buttons color-blue">+</button>
                <button class="buttons">0</button>
                <button class="buttons">00</button>
                <button class="buttons">.</button>
                <button class="buttons color-blue">=</button>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
